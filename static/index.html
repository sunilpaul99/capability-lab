<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capability Lab</title>
<style>
:root{
  --bg:#f7f6f3;--panel:#fff;--ink:#1d1d1b;--muted:#6b6a65;--line:#e4e2dc;
  --accent:#2b5e8c;--accent-ink:#fff;--good:#1f8f5f;--bad:#b4442c;--warn:#a46a00;--soft:#eef3f8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151513;--panel:#1e1e1c;--ink:#ecebe6;--muted:#a09e96;--line:#34332f;
  --accent:#7fb0dc;--accent-ink:#0d1a26;--good:#5cc896;--bad:#e8826b;--warn:#e0b04f;--soft:#1f2a35;}}
:root[data-theme="dark"]{--bg:#151513;--panel:#1e1e1c;--ink:#ecebe6;--muted:#a09e96;--line:#34332f;
  --accent:#7fb0dc;--accent-ink:#0d1a26;--good:#5cc896;--bad:#e8826b;--warn:#e0b04f;--soft:#1f2a35;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
nav{border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:0;height:100vh}
nav h1{font-size:17px;margin:0 0 4px}
nav .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
.step{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);margin-bottom:2px}
.step:hover{background:var(--soft)}
.step.active{background:var(--soft);color:var(--ink);font-weight:600}
.num{width:24px;height:24px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:12px;flex:none}
.step.done .num{background:var(--good);border-color:var(--good);color:#fff}
main{padding:32px 40px;max-width:980px}
h2{margin:0 0 6px;font-size:24px}
.lead{color:var(--muted);margin:0 0 22px;max-width:680px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],textarea,select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item input[type=checkbox]{margin-top:4px}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--soft);color:var(--accent);white-space:nowrap}
.tag.warn{color:var(--warn)} .tag.bad{color:var(--bad)}
.muted{color:var(--muted);font-size:13px}
.ok{color:var(--good);font-weight:600} .err{color:var(--bad)}
code,.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:340px;overflow:auto;font-size:13px;margin:6px 0}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.next{margin-top:20px;display:flex;justify-content:flex-end;gap:10px}
.big{font-size:28px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .muted{font-size:12px}
.verdict{font-size:18px;font-weight:600;margin:4px 0 6px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);transition:width .4s}
.win{color:var(--good)} .loss{color:var(--bad)}
details summary{cursor:pointer}
.help{font-size:13.5px;color:var(--ink);background:var(--bg);border-radius:8px;padding:2px 12px;margin:0 0 10px}.help p{margin:8px 0}
.item.nested{margin-left:26px!important;padding-left:12px;border-left:2px solid var(--line)}
.open{color:var(--accent);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.open:hover{text-decoration-color:var(--accent)}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:10;padding:4vh 16px}
#viewer.on{display:flex;justify-content:center}
#viewer .box{height:92vh;background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(860px,100%);display:flex;flex-direction:column;overflow:hidden}
#viewer .hd{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
#viewer iframe{flex:1;border:0;width:100%;background:var(--panel)}
#viewer pre{flex:1;margin:0;border:0;border-radius:0;max-height:none}
.fmrow{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px}
.fmrow .k{color:var(--muted)}.fmrow input{padding:5px 8px}.fmrow .raw{font:12px ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre-wrap}
.diff{flex:1;overflow:auto;padding:12px 16px;font:12.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap}
.diff .add{background:color-mix(in srgb,var(--good) 18%,transparent)}.diff .del{background:color-mix(in srgb,var(--bad) 18%,transparent);text-decoration:line-through}
.diff .ctx{color:var(--muted)}.diff .gap{color:var(--muted);font-style:italic;padding:4px 0}
.toastui-editor-defaultUI{border:0!important}
@media (max-width:760px){.wrap{grid-template-columns:1fr}nav{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
  main{padding:20px 16px}.cols,.stats{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.cols,.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<nav>
  <h1>Capability Lab</h1>
  <div class="sub">Find out whether a new skill, agent, or rule actually improves your Claude.</div>
  <div id="steps"></div>
</nav>
<main id="main"></main>
</div>
<div id="viewer" onclick="if(event.target===this)closeView()"><div class="box"><div class="hd"><div class="grow"><b id="vt"></b><div class="muted mono" id="vp"></div></div><button id="vback" onclick="back()" style="display:none">← Back</button><button id="vedit" onclick="startEdit()" style="display:none">Edit</button><span id="vedbtns" style="display:none" class="row"><button onclick="cancelEdit()">Cancel</button><button class="primary" onclick="reviewEdit()">Review and save</button></span><button id="vsrc" onclick="toggleSrc()">Show source</button><button onclick="closeView()">Close</button></div><div id="vb" style="flex:1;display:flex;min-height:0"></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const STEPS=[
 {k:'connect',t:'Connect'},
 {k:'setup',t:'Your current setup'},
 {k:'add',t:'Add a new capability'},
 {k:'tasks',t:'Pick test tasks'},
 {k:'run',t:'Run the comparison'},
 {k:'results',t:'Results and decision'},
];
const S={step:0,done:{},conn:null,setup:null,cands:[],cand:null,imp:null,tasks:[],runId:null};
try{S.step=+localStorage.getItem('cl-step')||0;S.cand=localStorage.getItem('cl-cand');S.runId=localStorage.getItem('cl-run')}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b){const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json();if(!r.ok)throw new Error(j.error||'Request failed');return j}
function save(){try{localStorage.setItem('cl-step',S.step);S.cand&&localStorage.setItem('cl-cand',S.cand);S.runId&&localStorage.setItem('cl-run',S.runId)}catch(e){}}
function nav(){ $('#steps').innerHTML=STEPS.map((s,i)=>`<div class="step ${i==S.step?'active':''} ${S.done[s.k]?'done':''}" onclick="go(${i})"><span class="num">${S.done[s.k]?'✓':i+1}</span>${s.t}</div>`).join('') }
function go(i){S.step=i;save();render()}
function nextBtn(label='Next'){return `<div class="next">${S.step>0?`<button onclick="go(${S.step-1})">Back</button>`:''}<button class="primary" onclick="go(${S.step+1})">${label} →</button></div>`}
let chain=Promise.resolve();function render(){chain=chain.then(_render,_render);return chain}
async function _render(){nav();const k=STEPS[S.step].k;$('#main').innerHTML='<p class="muted">Loading…</p>';try{await V[k]()}catch(e){$('#main').innerHTML=`<p class="err">${esc(e.message)}</p>`}nav()}

const V={};
V.connect=async()=>{
  const c=S.conn=await api('/api/connect');S.done.connect=c.logged_in;
  $('#main').innerHTML=`<h2>1. Connect to Claude</h2>
  <p class="lead">The lab runs Claude Code in the background to test things. It needs the Claude Code program and a signed-in account.</p>
  <div class="card">
   <div class="item"><div class="grow"><b>Claude Code program</b><div class="muted mono">${esc(c.cli||'not found')}</div></div>${c.cli?'<span class="ok">Found</span>':'<span class="err">Missing</span>'}</div>
   <div class="item"><div class="grow"><b>Signed in</b>${c.version?`<div class="muted">${esc(c.version)}</div>`:''}</div>${c.logged_in?'<span class="ok">Yes</span>':'<span class="err">Not yet</span>'}</div>
  </div>
  ${c.cli&&!c.logged_in?`<div class="card"><h3>One-time sign-in</h3>
   <p>Open the Terminal app, paste this line, and press Return. A browser window opens; sign in with your Claude account. Then come back and click <b>Check again</b>.</p>
   <pre class="mono" id="lc">${esc(c.login_command)}</pre>
   <div class="row"><button onclick="navigator.clipboard.writeText(document.getElementById('lc').textContent);this.textContent='Copied'">Copy</button><button class="primary" onclick="render()">Check again</button></div></div>`:''}
  ${!c.cli?`<div class="card"><p>Install the Claude desktop app or Claude Code, then click Check again.</p><button onclick="render()">Check again</button></div>`:''}
  ${c.logged_in?nextBtn():''}`;
};

V.setup=async()=>{
  const d=S.setup=await api('/api/setup');
  const sel=new Set(d.saved?d.saved.selected:d.found.filter(f=>f.default).map(f=>f.path));
  S.done.setup=!!d.saved;
  const blocked=d.found.filter(f=>f.kind=='blocked');d.found=d.found.filter(f=>f.kind!='blocked');
  const groups={};d.found.forEach(f=>(groups[f.kind]=groups[f.kind]||[]).push(f));
  $('#main').innerHTML=`<h2>2. Your current setup</h2>
  <p class="lead">This is the "before" in the comparison. Tick everything that shapes how Claude works for you today: memory, standing rules, voice guides. Every test runs with these, and the "after" adds the new capability on top.</p>
  ${Object.keys(groups).sort((a,b)=>SECTION_ORDER.indexOf(a)-SECTION_ORDER.indexOf(b)).map(g=>`<div class="card"><h3>${esc(g[0].toUpperCase()+g.slice(1))} <span class="muted">(${groups[g].length})</span></h3>${helpBox(g)}
   ${groups[g].map(f=>`<label class="item ${f.role=='listed'||f.role=='unlisted'?'nested':''}" style="margin:0;color:var(--ink)"><input type="checkbox" class="sp" value="${esc(f.path)}" ${sel.has(f.path)?'checked':''}><div class="grow"><div><span class="open" onclick="event.preventDefault();view(${esc(JSON.stringify(f.path))})">${esc(f.label.split('/').pop())}</span>${f.role=='index'?' <span class="tag">index · start here</span>':''}${f.role=='unlisted'?' <span class="tag warn">not in index</span>':''}</div><div class="muted mono">${esc(f.label)} · ${Math.round(f.size/1000)} KB</div></div></label>`).join('')}</div>`).join('')||'<div class="card muted">Nothing found yet. Add a folder below.</div>'}
  ${blocked.length?`<div class="card" style="border-color:var(--warn)"><b>macOS blocked reading:</b> <span class="mono">${blocked.map(b=>esc(b.label)).join(', ')}</span><p class="muted">Start the lab by double-clicking <b>Start Capability Lab</b> in Finder (it runs from Terminal, which has access), or add files one by one below.</p></div>`:''}
  <div class="card"><h3>Other files to include</h3>${helpBox('other files')}
   <textarea id="extra" style="min-height:60px" class="mono">${esc((d.saved&&d.saved.extra||[]).join('\n'))}</textarea></div>
  <div class="card"><h3>Folders to look in</h3>${helpBox('folders')}
   <textarea id="roots" style="min-height:60px" class="mono">${esc(d.roots.join('\n'))}</textarea><div class="row" style="margin-top:8px"><button onclick="saveRoots()">Rescan</button></div></div>
  <div class="card"><h3>Anything else Claude should always know</h3>${helpBox('notes')}<textarea id="notes" placeholder="e.g. I run the Bell AI Fellowship. Plain voice, no hype words.">${esc(d.saved?d.saved.notes:'')}</textarea></div>
  <div class="next"><button onclick="go(0)">Back</button><button class="primary" onclick="saveSetup()">Save and continue →</button></div>`;
};
const SECTION_ORDER=['memory','instructions','rules page','added by you','skill (always loaded)','agent (always loaded)'];
const SECTION_HELP={
 'memory':{what:'Notes Claude writes for itself about you: your preferences, corrections you have made, facts about your projects. MEMORY.md is the index, and Claude reads it at the start of every session in that folder. It opens the other files when they look relevant.',
   who:'both',how:'Fix a wrong fact or reword a note yourself; that is safe. To add or remove a memory, ask Claude, because it also has to update the index and the links between notes.',
   ask:'Remember that I prefer…  /  Forget the note about…'},
 'instructions':{what:'Standing instructions for a project folder. Claude reads CLAUDE.md automatically at the start of every session in that folder. Other files here, like SCHEMA.md, are read when something points Claude to them.',
   who:'you',how:'Edit these yourself. They are plain English, and you are the best judge of how you want Claude to work. Keep them short, since Claude reads them every time.',
   ask:'Add a rule to CLAUDE.md that…'},
 'rules page':{what:'Your own notes, such as a voice guide or operating procedures. Claude reads them only when a task, a memory, or an instruction file sends it there. In this lab, a ticked page is included in every test.',
   who:'you',how:'Edit these yourself; they are your documents. Ask Claude when the update depends on evidence, such as refreshing your voice guide from recent writing.',
   ask:'Update writing-voice.md using my last three essays'},
 'added by you':{what:'Files you added in the box below. The lab treats them like rules pages.',who:'you',how:'Edit freely.'},
 'skill (always loaded)':{what:'Skills installed for all your Claude Code sessions. Claude always sees each skill\'s one-line description and loads the full instructions when a request matches it.',
   who:'claude',how:'Small wording fixes in the body are fine to make yourself. The description decides when the skill fires, so for changes there, ask Claude and then retest the skill here.',
   ask:'Make my X skill also trigger for…'},
 'agent (always loaded)':{what:'Helper agents Claude can hand work to, each with its own instructions and tools.',
   who:'claude',how:'Better to ask Claude, since the tool list and description need to stay consistent. Retest here after a change.',
   ask:'Change my reviewer agent so it also checks…'},
 'other files':{what:'Any other file you want included as standing rules in these tests, such as a style guide that lives somewhere else. Paste one full path per line, or drag a file in from Finder.',who:'you',how:'Only this app uses this list; it changes nothing in Claude.'},
 'folders':{what:'Where the lab looks for instruction files and rules pages. One folder per line.',who:'you',how:'Only this app uses this list; it changes nothing in Claude.'},
 'notes':{what:'Extra context added to both sides of every test, such as who you are and what you care about.',who:'you',how:'Only these tests use it. To make a note permanent, ask Claude to remember it.'},
};
function helpBox(k){const h=SECTION_HELP[k];if(!h)return'';
  const tag={you:'<span class="tag" style="color:var(--good)">Edit it yourself</span>',claude:'<span class="tag warn">Better to ask Claude</span>',both:'<span class="tag">Small fixes yourself · bigger changes via Claude</span>'}[h.who];
  return `<div class="help"><p>${esc(h.what)}</p><p>${tag} ${esc(h.how)}</p>${h.ask?`<p class="muted">Example to ask Claude: <i>“${esc(h.ask)}”</i></p>`:''}</div>`}
async function saveRoots(){await api('/api/roots',{roots:$('#roots').value.split('\n').map(s=>s.trim()).filter(Boolean)});render()}
async function saveSetup(){const selected=[...document.querySelectorAll('.sp:checked')].map(x=>x.value);await api('/api/setup',{selected,extra:$('#extra').value.split('\n').map(x=>x.trim()).filter(Boolean),notes:$('#notes').value});S.done.setup=true;go(2)}

V.add=async()=>{
  [S.cands,S.cat]=await Promise.all([api('/api/candidates'),S.cat?Promise.resolve(S.cat):api('/api/catalog')]);S.done.add=!!S.cands.length;
  const haveNames=new Set(S.cands.map(c=>c.name));const groupsC=[...new Set(S.cat.map(c=>c.group))];
  const mode=S.addMode||'git';
  $('#main').innerHTML=`<h2>3. Add a new capability</h2>
  <p class="lead">Bring in a skill, agent, or set of rules you want to try. Point at a GitHub repo, a folder, or paste the text. The lab finds the usable pieces; nothing runs yet.</p>
  <div class="card"><h3>Ready to try</h3><p class="muted" style="margin-top:0">Picked for your work. <b>Try it</b> downloads the capability and adds a few matching Bell AI test tasks to step 4.</p>
   ${groupsC.map(g=>`<div style="margin-top:14px"><div class="muted" style="font-weight:600;text-transform:uppercase;font-size:11.5px;letter-spacing:.04em">${esc(g)}</div>
    ${S.cat.filter(c=>c.group==g).map(c=>`<div class="item"><div class="grow"><b>${esc(c.title)}</b> <span class="tag">${esc(c.kind)}</span> <span class="muted">by ${esc(c.by)}</span>
      <div>${esc(c.what)}</div><div class="muted">Good for: ${esc(c.good_for)}${c.note?` <span style="color:var(--warn)">${esc(c.note)}</span>`:''}</div>
      <div class="muted"><a href="${esc(c.link)}" target="_blank" rel="noopener" style="color:inherit">View on GitHub</a> · ${c.tasks.length} test task${c.tasks.length>1?'s':''}</div></div>
      ${haveNames.has(c.id)?'<span class="ok" style="white-space:nowrap">Added ✓</span>':`<button class="primary" onclick="quickAdd('${esc(c.id)}',this)">Try it</button>`}</div>`).join('')}</div>`).join('')}
  </div>
  <div class="card"><h3>Or bring your own</h3><div class="tabs">${[['git','From GitHub'],['folder','From a folder'],['text','Paste text']].map(([k,t])=>`<button class="${mode==k?'on':''}" onclick="S.addMode='${k}';render()">${t}</button>`).join('')}</div>
  ${mode=='git'?`<label>Repository or folder link</label><input type="text" id="val" placeholder="e.g. https://github.com/anthropics/skills/tree/main/skills/brand-guidelines">
     <div class="muted" style="margin-top:6px">Paste a link to a GitHub repo or to one folder inside it. <span class="open" onclick="$('#val').value='https://github.com/anthropics/skills/tree/main/skills/internal-comms';$('#ist').textContent=''">Use this example</span> (Anthropic's internal-comms skill, good for Bell AI emails).</div>`:''}
  ${mode=='folder'?`<label>Folder path</label><input type="text" id="val" placeholder="e.g. ~/Downloads/some-skill">`:''}
  ${mode=='text'?`<div class="row"><div class="grow"><label>Name</label><input type="text" id="tname" placeholder="plain-voice-editor"></div><div><label>Type</label><select id="ttype"><option value="skill">Skill</option><option value="agent">Agent</option><option value="rule">Rules (always on)</option></select></div></div>
     <label>When should Claude use it? (one line, skills and agents)</label><input type="text" id="tdesc" placeholder="Use when editing prose the user will publish">
     <label>Instructions</label><textarea id="val" style="min-height:160px" placeholder="Paste the SKILL.md, agent definition, or rules here"></textarea>`:''}
  <div class="row" style="margin-top:12px"><button class="primary" id="scanb" onclick="doImport('${mode}')">Find capabilities</button><span id="ist" class="muted"></span></div></div>
  <div id="found"></div>
  ${S.cands.length?`<div class="card"><h3>Ready to test</h3>${S.cands.map(c=>`<label class="item" style="margin:0;color:var(--ink)"><input type="radio" name="cand" value="${esc(c.id)}" ${S.cand==c.id?'checked':''} onchange="S.cand=this.value;save()"><div class="grow"><b>${esc(c.name)}</b> ${c.skills.map(s=>`<span class="tag">skill: ${esc(s)}</span>`).join(' ')} ${c.agents.map(s=>`<span class="tag">agent: ${esc(s)}</span>`).join(' ')} ${c.has_rules?'<span class="tag">rules</span>':''}<div class="muted">${esc(c.source)} · ${esc(c.created)}</div><div class="muted">Read: ${(c.files||[]).map(f=>`<span class="open" onclick="event.preventDefault();view(${esc(JSON.stringify(f.path))})">${esc(f.label)}</span>`).join(' · ')}</div></div></label>`).join('')}</div>`:''}
  ${S.cands.length?nextBtn():''}`;
  if(S.imp)showFound(S.imp);
};
async function doImport(kind){
  const b={kind,value:$('#val').value.trim()};
  if(!b.value){$('#ist').innerHTML=`<span class="err">${kind=='git'?'Paste a GitHub link first. The grey text is only an example.':kind=='folder'?'Type a folder path first.':'Paste the instructions first.'}</span>`;return}
  if(kind=='text'){b.name=$('#tname').value;b.text_type=$('#ttype').value;b.description=$('#tdesc').value}
  $('#scanb').disabled=true;$('#ist').textContent=kind=='git'?'Downloading and scanning…':'Scanning…';
  try{S.imp=await api('/api/import',b);showFound(S.imp);$('#ist').textContent=''}catch(e){$('#ist').innerHTML=`<span class="err">${esc(e.message)}</span>`}
  $('#scanb').disabled=false;
}
function showFound(m){
  const usable=m.items.filter(i=>!i.blocked);
  $('#found').innerHTML=`<div class="card"><h3>Found in ${esc(m.source)}</h3>

function lineDiff(a,b){a=a.split('\n');b=b.split('\n');const n=a.length,m=b.length;

  const host=document.createElement('div');host.id='review';host.style.cssText='position:absolute;inset:0;background:var(--panel);display:flex;flex-direction:column;z-index:2';
  host.innerHTML=`<div class="row" style="padding:12px 16px;border-bottom:1px solid var(--line)"><b class="grow">Review changes to ${esc(VF.label.split('/').pop())}</b><button onclick="this.closest('#review').remove()">Keep editing</button><button class="primary" id="dosave">Save</button></div>
   <div class="muted" style="padding:8px 16px 0">Green lines are added, struck-through lines removed. The current version is backed up before saving.</div>
   <div class="diff">${d.map(x=>`<div class="${x.t}">${x.t=='add'?'+ ':x.t=='del'?'− ':x.t=='ctx'?'  ':''}${esc(x.s)||'&nbsp;'}</div>`).join('')}</div>`;
  const box=$('#viewer .box');box.style.position='relative';box.appendChild(host);
  $('#dosave').onclick=async()=>{try{const r=await api('/api/save',{path:VF.path,text:next,mtime:VF.mtime});host.remove();ED=null;$('#vb').style.flexDirection='';
    await view(VF.path,false);const n=document.createElement('div');n.className='muted';n.style.cssText='padding:6px 16px;border-bottom:1px solid var(--line)';n.innerHTML=`<span class="ok">Saved.</span> Previous version backed up to <span class="mono">${esc(r.backup)}</span>`;$('#vb').before(n);setTimeout(()=>n.remove(),8000)}
    catch(e){alert(e.message)}};
}
async function wireLinks(doc,from){
  const as=[...doc.querySelectorAll('a')].filter(a=>a.dataset.wiki||(a.getAttribute('href')&&!/^([a-z]+:|#|\/\/)/i.test(a.getAttribute('href'))));
  if(!as.length)return;
  const links=as.map(a=>a.dataset.wiki?{kind:'wiki',target:a.dataset.wiki}:{kind:'rel',target:a.getAttribute('href')});
  let res=[];try{res=await api('/api/resolve',{from,links})}catch(e){}
  as.forEach((a,i)=>{const p=res[i];a.removeAttribute('target');
    if(p){a.classList.add('local');a.href='#';a.title=p.split('/').pop();a.onclick=e=>{e.preventDefault();view(p,true)}}
    else{a.classList.add('missing');a.removeAttribute('href');a.title='No file with this name yet'}});
}
render();
</script>
